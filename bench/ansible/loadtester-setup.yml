---
# Load tester VM setup: Rust toolchain plus a release build of the loadtest
# crate. One playbook for every provider — the azure and aws variants differed
# only in whether azcopy was installed.
- name: Set up load tester VM (Rust toolchain + build loadtest binary)
  hosts: loadtester
  become: false
  gather_facts: true

  vars:
    loadtest_remote_dir: /home/{{ ansible_user }}/loadtest

  tasks:
    - name: Install build prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - build-essential
          - pkg-config
          - libssl-dev
          - curl
          - jq
        state: present
        update_cache: true

    - name: Install rustup
      ansible.builtin.shell: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain stable --profile minimal
      args:
        executable: /bin/bash
        creates: /home/{{ ansible_user }}/.cargo/bin/cargo

    - name: Sync loadtest crate to VM
      ansible.posix.synchronize:
        src: "{{ loadtest_local_dir }}/"
        dest: "{{ loadtest_remote_dir }}/"
        delete: true
        rsync_opts:
          # Excluding a path also protects it from --delete, so the remote
          # build cache survives while staying off the wire.
          - "--exclude=target"
          - "--exclude=Cargo.lock"

    - name: Build loadtest in release mode
      ansible.builtin.shell: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo build --release
      args:
        chdir: "{{ loadtest_remote_dir }}"
        executable: /bin/bash
      register: cargo_build
      changed_when: "'Compiling' in cargo_build.stderr or 'Compiling' in cargo_build.stdout"

    - name: Install azcopy
      # Azure only, and only for ad-hoc use from the load tester; bench.sh
      # uploads reports with the workstation's own azcopy.
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        cd /tmp
        curl -fsSL https://aka.ms/downloadazcopy-v10-linux | tar xz --strip-components=1 --wildcards '*/azcopy'
        install -m 0755 azcopy /usr/local/bin/azcopy
        rm -f azcopy
      args:
        executable: /bin/bash
        creates: /usr/local/bin/azcopy
      when: cloud | default('azure') == 'azure'
