---
# Registry VM setup, one playbook for every provider and every engine.
#
# This replaces the former registry-setup.yml / registry-setup-aws.yml pair,
# which were ~90% identical and duplicated the disk-detection block verbatim.
# The provider now only affects which storage credentials are passed through to
# a cloud-backed distribution config; everything else is common.
#
# `selected_engines` arrives fully resolved from bench.sh (via
# --extra-vars @engines-selected.json), so the engine table in
# config/engines.json is read in exactly one place and this playbook stays a
# dumb consumer of the result. Each entry carries:
#   name, kind, storage, port, option, label, data_dir, unit
- name: Set up the registry VM
  hosts: registry
  become: true
  gather_facts: true

  vars:
    summ_remote_dir: "/home/{{ ansible_user }}/summ-src"

  pre_tasks:
    - name: Require a resolved engine list
      # Fail loudly rather than provisioning a VM with no registry on it.
      ansible.builtin.assert:
        that:
          - selected_engines is defined
          - selected_engines | length > 0
        fail_msg: >-
          selected_engines is empty. bench.sh must pass
          --extra-vars @<run-dir>/engines-selected.json

    - name: Show the engines being provisioned
      ansible.builtin.debug:
        msg: "{{ selected_engines | map(attribute='name') | join(', ') }}"

  roles:
    - local_disk
    - tooling
    - role: distribution
      when: selected_engines | selectattr('kind', 'eq', 'distribution') | list | length > 0
    - role: summ
      when: selected_engines | selectattr('kind', 'eq', 'summ') | list | length > 0

  post_tasks:
    # Each engine is started once here purely to prove it serves /v2/. A broken
    # engine must fail at provision time, not halfway through a paid benchmark.
    - name: Verify each engine serves /v2/
      ansible.builtin.include_tasks: tasks/verify-engine.yml
      loop: "{{ selected_engines }}"
      loop_control:
        loop_var: engine
        label: "{{ engine.name }} (:{{ engine.port }})"
