[defaults]
host_key_checking = False
inventory = inventory/azure.ini
# community.general.yaml was removed in community.general 12; the same
# output now comes from the built-in callback with result_format.
stdout_callback = default
result_format = yaml
deprecation_warnings = False
retry_files_enabled = False
forks = 10

[ssh_connection]
ssh_args = -o ServerAliveInterval=30 -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
